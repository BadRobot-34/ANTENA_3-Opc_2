<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Antena 3 Internacional - DASH ClearKey</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
  <!-- Shaka Player Compiled Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>
  <script>
    const manifestUri = 'https://live-pv-ta.amazon.fastly-edge.com/iad-nitro/live/clients/dash/enc/dxnynpuvl4/out/v1/2c50fa7374c24990b81abf23e21560e2/cenc.mpd (https://live-pv-ta.amazon.fastly-edge.com/iad-nitro/live/clients/dash/enc/dxnynpuvl4/out/v1/2c50fa7374c24990b81abf23e21560e2/cenc.mpd)';
    async function initApp() {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        initPlayer();
      } else {
        console.error('El navegador no soporta Shaka Player.');
      }
    }
    async function initPlayer() {
      const video = document.getElementById('video');
      const player = new shaka.Player(video);
      player.addEventListener('error', (event) => {
        console.error('Error en Shaka Player:', event.detail);
      });
      // Configuración de la clave ClearKey (KID:KEY)
      player.configure({
        drm: {
          clearKeys: {
            '06acea1d12fd3a8351d1cd2331c69627': 'ddeb96c94f745c68d590dd462e47aac2'
          }
        }
      });
      // Personalización del User-Agent en la cabecera de red
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36';
      });
      try {
        await player.load(manifestUri);
        console.log('Emisión cargada con éxito.');
      } catch (e) {
        console.error('Error al cargar el stream:', e);
      }
    }
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
